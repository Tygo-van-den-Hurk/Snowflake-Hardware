# yaml-language-server: $schema=https://raw.githubusercontent.com/ergogen/ergogen/daaef0af7912c7e011ec424421c36210969e3fae/meta/schema.json
#
# This file is a config file from which `ergogen` will generate the PBCs, SVGs
# etc. I need those to build my keyboard. To not run into issues use ergogen
# v4.0.2 just like me. (run: `ergogen --version` for the up to date version)
# after you've entered a nix shell using `nix develop`.
#
---

X-common:
  keyboard:
    name: &silk-text "Snowflake: v3.0.0"
    version: &version "v3.0.0"
    creator: &creator '"Tygo van den Hurk"'
  cases:
    - &mounting-holes-extrude 4
    - &wall-height 4
  sides:
    - &back-side B
    - &frond-side F

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Units ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units:
  case_padding: 2.00  # The thickness of the walls around the case.
  extra_trace: 1.00   # The extra amount of padding 1 extra trace requires.
  pcb_padding: 2.25  # The space between the keys and the edge of the PCB.


# Directions
# functions that take care of whether something is positive or negative
units.direction_T: 1.00   # Top
units.direction_R: 1.00   # Right
units.direction_B: -1.00  # Bottom
units.direction_L: -1.00  # Left

meta:
  version: *version
  author: *creator

meta.i2c.scl: &i2c_scl P3
meta.i2c.sda: &i2c_sda P2

units.rotation: -15
points.rotate: rotation

points.mirror:
  ref: matrix_inner_top
  distance: 100

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Keys ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

meta.matrix_pinky_col_net: &matrix_pinky_col_net P14
meta.matrix_ring_col_net: &matrix_ring_col_net P15
meta.matrix_middle_col_net: &matrix_middle_col_net P18
meta.matrix_index_col_net: &matrix_index_col_net P19
meta.matrix_inner_col_net: &matrix_inner_col_net P20
meta.matrix_top_row_net: &matrix_top_row_net P4
meta.matrix_home_row_net: &matrix_home_row_net P5
meta.matrix_bottom_row_net: &matrix_bottom_row_net P6
meta.thumbfan_row_net: &thumbfan_row_net P7

# Regexes for placing things on keys
meta.key_placement_regexes:
  any_place_where_a_key_is: &any_place_where_a_key_is >-
    /(?:thumbfan|matrix)_.*/gi
  main_key_matrix_except_top: &main_key_matrix_except_top >-
    /^matrix_(?!.*top).*$/gi
  main_key_matrix_except_bottom: &main_key_matrix_except_bottom >-
    /^matrix_(?!.*bottom).*$/gi
  any_key_expect_the_outer_ones: &any_key_expect_the_outer_ones >-
    /(?:^matrix_(?!pinky)|^thumbfan_(?!.*near)).*$/gi

units.key_width: cx
units.key_height: cy
units.px: cx + 4
units.py: cy + 4

points.zones.matrix:
  key:
    padding: key_height
    spread: key_width
  anchor:
    rotate: 5
    shift: [100, -100]
  columns:
    pinky.key.col_net: *matrix_pinky_col_net
    ring.key:
      splay: -5
      origin: [-12, -19]
      stagger: 12
      col_net: *matrix_ring_col_net
    middle.key:
      stagger: 5
      col_net: *matrix_middle_col_net
    index.key:
      stagger: -6
      col_net: *matrix_index_col_net
    inner.key:
      stagger: -2
      col_net: *matrix_inner_col_net
  rows:  # ROW ORDER MATTERS!!!
    bottom.row_net: *matrix_bottom_row_net
    home.row_net: *matrix_home_row_net
    top.row_net: *matrix_top_row_net

points.zones.thumbfan:
  anchor.ref: matrix_inner_bottom
  anchor.shift: [-22, -23]
  rows.thumb.row_net: *thumbfan_row_net
  columns:
    near.key.col_net: *matrix_middle_col_net
    home.key.col_net: *matrix_index_col_net
    far.key.col_net: *matrix_inner_col_net

outlines._keys.main:
  what: rectangle
  fillet: 2
  where: *any_place_where_a_key_is
  size: [1*key_width - 0.5, 1*key_height - 0.5]

pcbs.snowflake.outlines.keys:
  outline: _keys
  layer: Eco1.User

pcbs.snowflake.footprints.keys_hotswap:
  what: choc
  where: *any_place_where_a_key_is
  params:
    keycaps: true
    hotswap: true
    reverse: true
    from: "{{col_net}}"
    to: "{{name}}"
pcbs.snowflake.footprints.keys_non_hotswap:
  what: choc
  where: *any_place_where_a_key_is
  adjust.rotate: 180
  params:
    keycaps: true
    hotswap: false
    reverse: true
    from: "{{col_net}}"
    to: "{{name}}"

# Key diodes
pcbs.snowflake.footprints.keys_diode:
  what: diodes/sod-123w
  where: *any_place_where_a_key_is
  params:
    from: "{{name}}"
    to: "{{row_net}}"
  adjust:
    shift: [4.8, -7]
    rotate: 180

# Key via's for pre-wiring keys
pcbs.snowflake.footprints.keys_via_top:
  what: routing/node
  where: *any_place_where_a_key_is
  params.net: "{{name}}"
  adjust.shift:
    - &via-top-shift-x 0
    - &via-top-shift-y -3.5
pcbs.snowflake.footprints.keys_via_middle:
  what: routing/node
  where: *any_place_where_a_key_is
  params.net: "{{col_net}}"
  adjust.shift:
    - &via-middle-shift-x 0
    - &via-middle-shift-y 3.5
pcbs.snowflake.footprints.keys_via_bottom:
  what: routing/node
  where: *any_key_expect_the_outer_ones
  params.net: "{{row_net}}"
  adjust.shift:
    - &via-bottom-shift-x 0
    - &via-bottom-shift-y -8.5

# This is where we route up every thing on a single key
# We can do this bc we know where things on an individual
# keys is. We can not do inter key routes this way as
# they are dynamically located, this is all in respect to
# the center of the key.
pcbs.snowflake.footprints.keys_route_from_top_via_to_higher_frond_pad:
  what: routing/trace
  where: *any_place_where_a_key_is
  params:
    side: *back-side
    net: "{{name}}"
    points:
      - start.x: *via-top-shift-x
        start.y: *via-top-shift-y
        end.x: &route-from-top-via-to-higher-pad-stop-1-x-frond -1
        end.y: &route-from-top-via-to-higher-pad-stop-1-y -4
      - start.x: *route-from-top-via-to-higher-pad-stop-1-x-frond
        start.y: *route-from-top-via-to-higher-pad-stop-1-y
        end.y: &route-from-top-via-to-higher-pad-stop-2-y -6
        end.x: &route-from-top-via-to-higher-pad-stop-2-x-left -3
      - start.x: *route-from-top-via-to-higher-pad-stop-1-x-frond
        start.y: *route-from-top-via-to-higher-pad-stop-1-y
        end.x: &route-from-top-via-to-higher-pad-stop-3-x-left -5
        end.y: &route-from-top-via-to-higher-pad-stop-3-y 4
pcbs.snowflake.footprints.route-from-top-via-to-higher-back-pad:
  what: routing/trace
  where: *any_place_where_a_key_is
  params:
    side: *frond-side
    net: "{{name}}"
    points:
      - start.x: *via-top-shift-x
        start.y: *via-top-shift-y
        end.x: &route-from-top-via-to-higher-pad-stop-1-x-back 1
        end.y: *route-from-top-via-to-higher-pad-stop-1-y
      - start.x: *route-from-top-via-to-higher-pad-stop-1-x-back
        start.y: *route-from-top-via-to-higher-pad-stop-1-y
        end.y: *route-from-top-via-to-higher-pad-stop-2-y
        end.x: &route-from-top-via-to-higher-pad-stop-2-x-right 3
      - start.x: *route-from-top-via-to-higher-pad-stop-1-x-back
        start.y: *route-from-top-via-to-higher-pad-stop-1-y
        end.x: &route-from-top-via-to-higher-pad-stop-3-x-right 5
        end.y: *route-from-top-via-to-higher-pad-stop-3-y

pcbs.snowflake.footprints.route-from-middle-via-to-lower-frond-pad:
  what: routing/trace
  where: *any_place_where_a_key_is
  params:
    side: *frond-side
    net: "{{col_net}}"
    points:
      - start.x: *via-middle-shift-x
        start.y: *via-middle-shift-y
        end.x: &route-from-middle-via-to-lower-pad-stop-1-x-frond -5
        end.y: &route-from-middle-via-to-lower-pad-stop-1-y -1.5
      - start.x: *route-from-middle-via-to-lower-pad-stop-1-x-frond
        start.y: *route-from-middle-via-to-lower-pad-stop-1-y
        end.x: &route-from-middle-via-to-lower-pad-stop-2-x-frond -7
        end.y: &route-from-middle-via-to-lower-pad-stop-2-y -1.5
      - start.x: *route-from-middle-via-to-lower-pad-stop-2-x-frond
        start.y: *route-from-middle-via-to-lower-pad-stop-2-y
        end.y: &route-from-middle-via-to-lower-pad-stop-3-y -4
        end.x: -8.1
pcbs.snowflake.footprints.route-from-middle-via-to-lower-back-pad:
  what: routing/trace
  where: *any_place_where_a_key_is
  params:
    side: *back-side
    net: "{{col_net}}"
    points:
      - start.x: *via-middle-shift-x
        start.y: *via-middle-shift-y
        end.x: &route-from-middle-via-to-lower-pad-stop-1-x-back 5
        end.y: *route-from-middle-via-to-lower-pad-stop-1-y
      - start.x: *route-from-middle-via-to-lower-pad-stop-1-x-back
        start.y: *route-from-middle-via-to-lower-pad-stop-1-y
        end.x: &route-from-middle-via-to-lower-pad-stop-2-x-back 7
        end.y: *route-from-middle-via-to-lower-pad-stop-2-y
      - start.x: *route-from-middle-via-to-lower-pad-stop-2-x-back
        start.y: *route-from-middle-via-to-lower-pad-stop-2-y
        end.y: *route-from-middle-via-to-lower-pad-stop-3-y
        end.x: 8.1
pcbs.snowflake.footprints.route-from-middle-via-to-lower-hole:
  what: routing/trace
  where: *any_place_where_a_key_is
  params:
    side: *back-side
    net: "{{col_net}}"
    points:
      - start.x: *via-middle-shift-x
        start.y: *via-middle-shift-y
        end.x: &lower-hole-x 0
        end.y: &lower-hole-y 6
      - start.x: *lower-hole-x
        start.y: *lower-hole-y
        end.x: 3.25
        end.y: 7

pcbs.snowflake.footprints.route-from-edge-to-bottom-via:
  what: routing/trace
  where: *any_key_expect_the_outer_ones
  params:
    side: *frond-side
    net: "{{row_net}}"
    points:
      - start.x: -7.5
        start.y: &lower-via-route-start-y 8.5
        end.x: *via-bottom-shift-x
        end.y: *lower-via-route-start-y
pcbs.snowflake.footprints.route-from-bottom-via-to-diode:
  what: routing/trace
  where: *any_key_expect_the_outer_ones
  params:
    side: *back-side
    net: "{{row_net}}"
    points:
      - start.x: *via-bottom-shift-x
        start.y: *lower-via-route-start-y
        end.x: &to-lower-diode-stop-1-x 6.25
        end.y: *lower-via-route-start-y
      - start.x: *to-lower-diode-stop-1-x
        start.y: *lower-via-route-start-y
        end.x: *to-lower-diode-stop-1-x
        end.y: 7

# INTER KEY ROUTES : Top pads to upper key
pcbs.snowflake.footprints.route-from-higher-frond-pad-to-upper-key:
  what: routing/trace
  where: *main_key_matrix_except_top
  params:
    side: *back-side
    net: "{{name}}"
    points:
      - start.x: *route-from-top-via-to-higher-pad-stop-2-x-left
        start.y: *route-from-top-via-to-higher-pad-stop-2-y
        end.x: &route-to-neighboring-key-x-left -4.7
        end.y: &start-inter-key-column-y -8.5
pcbs.snowflake.footprints.route-from-higher-back-pad-to-upper-key:
  what: routing/trace
  where: *main_key_matrix_except_top
  params:
    side: *frond-side
    net: "{{name}}"
    points:
      - start.x: *route-from-top-via-to-higher-pad-stop-2-x-right
        start.y: *route-from-top-via-to-higher-pad-stop-2-y
        end.y: *start-inter-key-column-y
        end.x: &route-to-neighboring-key-x-right 4.7

# INTER KEY ROUTES : higher holes to lower key
pcbs.snowflake.footprints.route-from-higher-hole-pad-to-lower-key-left:
  what: routing/trace
  where: *main_key_matrix_except_bottom
  params:
    side: *back-side
    net: "{{name}}"
    points:
      - start.x: *route-from-top-via-to-higher-pad-stop-3-x-left
        start.y: *route-from-top-via-to-higher-pad-stop-3-y
        end.x: *route-to-neighboring-key-x-left
        end.y: &start-inter-key-column-y-lower 8.5
pcbs.snowflake.footprints.route-from-higher-hole-pad-to-lower-key-right:
  what: routing/trace
  where: *main_key_matrix_except_bottom
  params:
    side: *frond-side
    net: "{{name}}"
    points:
      - start.x: *route-from-top-via-to-higher-pad-stop-3-x-right
        start.y: *route-from-top-via-to-higher-pad-stop-3-y
        end.x: *route-to-neighboring-key-x-right
        end.y: *start-inter-key-column-y-lower

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Touchpad ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units.touchpad_width: 65
units.touchpad_height: 49

points.zones.touchpad:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    aggregate.parts: [matrix_index_top, thumbfan_far_thumb]
    rotate: -1 * rotation

outlines._touchpad.body:
  size: [touchpad_width, touchpad_height]
  what: rectangle
  fillet: 1
  where: &touchpad_outline_where
    aggregate.parts: [touchpad_x_y, mirror_touchpad_x_y]
    shift: [0, -19.5]
outlines._touchpad_pcb.body: &touchpad_pcb
  size: [touchpad_width + 2 * pcb_padding, touchpad_height + 2 * pcb_padding]
  what: rectangle
  where: *touchpad_outline_where

pcbs.snowflake.outlines.touchpad:
  outline: _touchpad
  layer: Eco1.User

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Controller ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units.controller_width: 19
units.controller_height: 32

points.zones.controller:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: matrix_index_top
    rotate: -1 * rotation
    shift:
      - 3*(key_width /2) + 1*(controller_width /2) + 6
      - 1*(key_height/2) + 2*(controller_height/2) - 10

outlines._controller.main:
  what: rectangle
  size: [controller_width, controller_height]
  fillet: 1
  where: &controller_outline_where
    aggregate.parts: [controller_x_y, mirror_controller_x_y]
    shift: [0, -28]
outlines._controller_pcb.main: &controller_pcb
  what: rectangle
  where: *controller_outline_where
  size:
    - controller_width + 2 * pcb_padding
    - controller_height + 2 * pcb_padding

pcbs.snowflake.outlines.controller:
  outline: _controller
  layer: Eco1.User

pcbs.snowflake.footprints.controller:
  what: controllers/promicro_pretty
  adjust.rotate: 270
  where: *controller_outline_where

# = 3 way jumper for deciding the side.
# Connect this jumper with a resistor on the back to drive the pin high on one
# side, and low on another. This allows the PCB to figure out on what side it
# is by reading the pin that you connect this way.
pcbs.snowflake.footprints.keyboard_side_jumper:
  what: jumpers/3-way
  params.A: P21
  params.B: GND
  params.C: VCC
  params.size: 2.54
  where: *controller_outline_where
  adjust:
    rotate: 90
    shift:
      - direction_L*( controller_width /4 - 2.0000 )
      - direction_T*( controller_height/8 + 0.5500 )

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ TRRS Connector ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units.trrs_width: 13.0
units.trrs_height: 10.0

points.zones.trrs:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: controller_x_y
    shift:
      - direction_R*( controller_width /2 - trrs_width/2 + case_padding)
      - direction_B*( controller_height/2 + 6.8500 )

outlines._trrs:
  main:
    what: rectangle
    size: [trrs_width, trrs_height]
    where: &trrs_outline_where
      ref: trrs_x_y
      shift: &trrs_outline_shift [0, 0]
  connector:
    operation: add
    what: rectangle
    size: [case_padding + pcb_padding, trrs_height*(0.9)]
    where: *trrs_outline_where
    adjust.shift: [trrs_width/2, 0]

pcbs.snowflake.outlines.trrs:
  outline: _trrs
  layer: Eco1.User

pcbs.snowflake.footprints.trrs:
  what: connectors/trrs-pj-320a-dual
  where: *trrs_outline_where
  params:
    reverse: true
    symmetric: false
    drawing: false
    A: VCC
    B: GND
    C: *i2c_scl
    D: *i2c_sda
  adjust.rotate: -90
  adjust.shift:
    - direction_R*( trrs_width /2 + 0.45 )
    - direction_B*( trrs_height*0 + 1.15 )

pcbs.snowflake.footprints.trrs_side_jumper:
  # For a I2C connection you need 2 pull up resistors that pull up the SDA and
  # SCL lines. That is why I added this footprint, to solder on the resistors,
  # one on each side.
  what: jumpers/3-way
  params.A: VCC
  params.B: *i2c_scl
  params.C: *i2c_sda
  # params.size: 2.54
  where: *trrs_outline_where
  adjust.rotate: 0
  adjust.shift: [direction_R*(1.75), 0]

pcbs.snowflake.footprints.route-P2-to-jumper-for-the-trrs-connector:
  what: routing/trace
  where: *trrs_outline_where
  params:
    side: *back-side
    net: *i2c_sda
    points:
      - start.x: &P2-to-jumper-start-x 1
        start.y: &P2-to-jumper-start-y 3.3
        end.x: &P2-to-jumper-middle-x 3
        end.y: &P2-to-jumper-middle-y 0
      - start.x: *P2-to-jumper-middle-x
        start.y: *P2-to-jumper-middle-y
        end.x: *P2-to-jumper-start-x
        end.y: &P2-to-jumper-end-y -3.3
pcbs.snowflake.footprints.route-P3-to-jumper-for-the-trrs-connector:
  what: routing/trace
  where: *trrs_outline_where
  params:
    side: *frond-side
    net: *i2c_scl
    points:
      - start.x: &P3-to-jumper-start-x 4
        start.y: *P2-to-jumper-start-y
        end.x: *P2-to-jumper-middle-x
        end.y: *P2-to-jumper-middle-y
      - start.x: *P2-to-jumper-middle-x
        start.y: *P2-to-jumper-middle-y
        end.x: *P3-to-jumper-start-x
        end.y: *P2-to-jumper-end-y
pcbs.snowflake.footprints.route-VCC-to-jumper-for-the-trrs-connector:
  what: routing/trace
  where: *trrs_outline_where
  params:
    side: *frond-side
    net: VCC
    points:
      - start.x: &VCC-to-jumper-start-x -4
        start.y: 1
        end.x: &VCC-to-jumper-middle-x -3
        end.y: &VCC-to-jumper-middle-y 0
      - start.x: *VCC-to-jumper-start-x
        start.y: -1
        end.x: *VCC-to-jumper-middle-x
        end.y: *VCC-to-jumper-middle-y
      - start.x: *VCC-to-jumper-middle-x
        start.y: *VCC-to-jumper-middle-y
        end.x: 0.5
        end.y: 0
pcbs.snowflake.footprints.route-GND-to-GND-for-the-trrs-connector:
  what: routing/trace
  where: *trrs_outline_where
  params:
    side: *frond-side
    net: GND
    points:
      - start.x: &GND-to-GND-start-x -3.7
        start.y: *P2-to-jumper-start-y
        end.x: &GND-to-GND-middle-x -6.3
        end.y: &GND-to-GND-middle-start-y 3.3
      - start.x: *GND-to-GND-middle-x
        start.y: *GND-to-GND-middle-start-y
        end.x: *GND-to-GND-middle-x
        end.y: &GND-to-GND-middle-end-y -3.3
      - start.x: *GND-to-GND-middle-x
        start.y: *GND-to-GND-middle-end-y
        end.x: *GND-to-GND-start-x
        end.y: *P2-to-jumper-end-y

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Nix Logo ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

points.zones.nix:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: matrix_ring_bottom
    shift: [6, -21]

outlines._nix.main:
  what: circle
  radius: 8
  where: &nix_outline_where
    ref: nix_x_y
    shift: [0, 0]

pcbs.snowflake.outlines.nix:
  outline: _nix
  layer: Dwgs.User

# = NixOS Logo
# see: https://raw.githubusercontent.com/Tygo-van-den-Hurk/keyboard/
# refs/tags/v1.0.0/ergogen/images/nix.svg
# to know what color nix piece refers to what.
pcbs.snowflake.footprints.nix_piece_orange: &nix_piece
  what: decoration/images/nix-piece
  params.scale: 0.03
  where: *nix_outline_where
  adjust:
    shift: [-19.06, -8.44]
    rotate: -14.4
pcbs.snowflake.footprints.nix_piece_yellow:
  <<: *nix_piece
  adjust:
    shift: [-2.12, -20.77]
    rotate: 45.6
pcbs.snowflake.footprints.nix_piece_green:
  <<: *nix_piece
  adjust:
    shift: [17.04, -12.26]
    rotate: 105.60
pcbs.snowflake.footprints.nix_piece_blue:
  <<: *nix_piece
  adjust:
    shift: [19.04, 8.39]
    rotate: 165.60
pcbs.snowflake.footprints.nix_piece_purple:
  <<: *nix_piece
  adjust:
    shift: [2.04, 20.79]
    rotate: 225.60
pcbs.snowflake.footprints.nix_piece_red:
  <<: *nix_piece
  adjust:
    shift: [-16.96, 12.28]
    rotate: 285.60

# Text on the board
pcbs.snowflake.footprints.front_text: &silkscreen_print
  what: decoration/text
  where: *nix_outline_where
  adjust.rotate: -14
  adjust.shift:
    - -6.5
    - &text-shift-y -10
  params.text: *silk-text
  params.layer: F.SilkS
  params.justify: left
pcbs.snowflake.footprints.back_text:
  <<: *silkscreen_print
  adjust.rotate: -14
  adjust.shift:
    - 6.5
    - *text-shift-y
  params.layer: B.SilkS
  params.justify: left mirror

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Mounting Holes ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units.mounting_hole_outer_radius: &mounting_hole_outer_radius 2.5
units.mounting_hole_outer_diameter: 2*mounting_hole_outer_radius
units.mounting_hole_inner_radius: &mounting_hole_inner_radius 1.5
units.mounting_hole_inner_diameter: 2*mounting_hole_inner_radius

points.zones.mounting_hole_top_right:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: matrix_inner_top
    shift: [(key_width/2) + 3, 7.5]
points.zones.mounting_hole_bottom_right:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: thumbfan_far_thumb
    shift: [direction_R*(12.5), direction_B*(6)]
points.zones.mounting_hole_bottom_left:
  columns.x.rows.y.bind: [0, 0]
  anchor:
    ref: matrix_ring_bottom
    shift: [-6, -12.5]

outlines._mounting:
  # top right
  - &mounting_outer_outline
    what: circle  # outer
    radius: mounting_hole_outer_radius
    where: &mounting_top_right_where
      ref: mounting_hole_top_right_x_y
      shift: [0, 0]
  - &mounting_inner_outline
    what: circle
    radius: mounting_hole_inner_radius
    operation: subtract
    where: *mounting_top_right_where
  - <<: *mounting_outer_outline
    where: &mirror_mounting_top_right_where
      ref: mirror_mounting_hole_top_right_x_y
      shift: [0, 0]
  - <<: *mounting_inner_outline
    where: *mirror_mounting_top_right_where

  # bottom right
  - <<: *mounting_outer_outline
    where: &mounting_bottom_right_where
      ref: mounting_hole_bottom_right_x_y
      shift: [0, 0]
  - <<: *mounting_inner_outline
    where: *mounting_bottom_right_where
  - <<: *mounting_outer_outline
    where: &mirror_mounting_bottom_right_where
      ref: mirror_mounting_hole_bottom_right_x_y
      shift: [0, 0]
  - <<: *mounting_inner_outline
    where: *mirror_mounting_bottom_right_where

  # bottom left
  - <<: *mounting_outer_outline
    where: &mounting_bottom_left_where
      ref: mounting_hole_bottom_left_x_y
      shift: [0, 0]
  - <<: *mounting_inner_outline
    where: *mounting_bottom_left_where
  - <<: *mounting_outer_outline
    where: &mirror_mounting_bottom_left_where
      ref: mirror_mounting_hole_bottom_left_x_y
      shift: [0, 0]
  - <<: *mounting_inner_outline
    where: *mirror_mounting_bottom_left_where

pcbs.snowflake.outlines.mounting:
  outline: _mounting
  layer: Eco1.User

pcbs.snowflake.footprints.mounting_hole_top_right:
  what: mounting-holes/m2
  where: *mounting_top_right_where
pcbs.snowflake.footprints.mirror_mounting_hole_top_right:
  what: mounting-holes/m2
  where: *mirror_mounting_top_right_where

pcbs.snowflake.footprints.mounting_hole_bottom_right:
  what: mounting-holes/m2
  where: *mounting_bottom_right_where
pcbs.snowflake.footprints.mirror_mounting_hole_bottom_right:
  what: mounting-holes/m2
  where: *mirror_mounting_bottom_right_where

pcbs.snowflake.footprints.mounting_hole_bottom_left:
  what: mounting-holes/m2
  where: *mounting_bottom_left_where
pcbs.snowflake.footprints.mirror_mounting_hole_bottom_left:
  what: mounting-holes/m2
  where: *mirror_mounting_bottom_left_where


# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Reset Switch ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

points.zones.reset:
  columns.x.rows.y.bind: [0, 0]
  anchor.ref: matrix_inner_bottom
  anchor.shift:
    - (key_width /2) + 3
    - (key_height/2) + 7.5

outlines._reset.main: &reset_outline
  what: rectangle
  size: [5, 7]
  fillet: 1
  where: &reset_outline_where
    ref: reset_x_y
    shift: [0, 0]
    rotate: 180

pcbs.snowflake.outlines.reset:
  outline: _reset
  layer: Eco1.User

pcbs.snowflake.footprints.reset:
  what: buttons/wuerth-434121025816
  params.r1: RST
  params.r2: GND
  where: *reset_outline_where

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Board Outline ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #

units.board_fillet: &board_fillet 1
units.escape_key: key_width / 2
units.case_key_distance: pcb_padding + escape_key
units.escape_controller_width: controller_width  / 2
units.escape_controller_height: controller_height / 2
units.case_controller_width_distance: pcb_padding + escape_controller_width
units.case_controller_height_distance: pcb_padding + escape_controller_height

outlines._finger_pcb.base:
  $params: [b_l, t_l, t_r, b_r]
  operation: add
  what: polygon
  fillet: *board_fillet
  points:
    - ref: b_l
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: t_l
      shift: [direction_L * case_key_distance, direction_T * case_key_distance]
    - ref: t_r
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: b_r
      shift: [direction_R * case_key_distance, direction_B * case_key_distance]
outlines._board:
  pinky:
    $extends: outlines._finger_pcb.base
    $args: [&b matrix_pinky_bottom, &t matrix_pinky_top, *t, *b]
  ring:
    $extends: outlines._finger_pcb.base
    $args: [&b matrix_ring_bottom, &t matrix_ring_top, *t, *b]
  middle:
    $extends: outlines._finger_pcb.base
    $args: [&b matrix_middle_bottom, &t matrix_middle_top, *t, *b]
  index:
    $extends: outlines._finger_pcb.base
    $args: [&b matrix_index_bottom, &t matrix_index_top, *t, *b]
  inner:
    $extends: outlines._finger_pcb.base
    $args: [&b matrix_inner_bottom, &t matrix_inner_top, *t, *b]
  thumb:
    $extends: outlines._finger_pcb.base
    $args: [&l thumbfan_near_thumb, *l, &r thumbfan_far_thumb, *r]
  mirror_pinky:
    $extends: outlines._finger_pcb.base
    $args: [&b mirror_matrix_pinky_bottom, &t mirror_matrix_pinky_top, *t, *b]
  mirror_ring:
    $extends: outlines._finger_pcb.base
    $args: [&b mirror_matrix_ring_bottom, &t mirror_matrix_ring_top, *t, *b]
  mirror_middle:
    $extends: outlines._finger_pcb.base
    $args: [&b mirror_matrix_middle_bottom, &t mirror_matrix_middle_top, *t, *b]
  mirror_index:
    $extends: outlines._finger_pcb.base
    $args: [&b mirror_matrix_index_bottom, &t mirror_matrix_index_top, *t, *b]
  mirror_inner:
    $extends: outlines._finger_pcb.base
    $args: [&b mirror_matrix_inner_bottom, &t mirror_matrix_inner_top, *t, *b]
  mirror_thumb:
    $extends: outlines._finger_pcb.base
    $args: [&l mirror_thumbfan_near_thumb, *l, &r mirror_thumbfan_far_thumb, *r]
  touchpad: *touchpad_pcb
  controller: *controller_pcb
outlines._board.filler1:
  what: polygon
  fillet: *board_fillet
  points:
    - ref: matrix_pinky_home
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: matrix_pinky_bottom
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: thumbfan_near_thumb
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_B * case_key_distance]
    - ref: thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: matrix_inner_top
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: matrix_inner_top
      shift: [direction_L * case_key_distance, direction_T * case_key_distance]
outlines._board.filler1_mirror:
  what: polygon
  fillet: *board_fillet
  points:
    - ref: mirror_matrix_pinky_home
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: mirror_matrix_pinky_bottom
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: mirror_thumbfan_near_thumb
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: mirror_thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_B * case_key_distance]
    - ref: mirror_thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: mirror_matrix_inner_top
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: mirror_matrix_inner_top
      shift: [direction_L * case_key_distance, direction_T * case_key_distance]
outlines._board.bridge:
  what: polygon
  fillet: *board_fillet
  points:
    - ref: matrix_inner_top
      shift: [direction_L * case_key_distance, direction_T * case_key_distance]
    - ref: matrix_inner_top
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: mirror_matrix_inner_top
      shift: [direction_R * case_key_distance, direction_T * case_key_distance]
    - ref: mirror_matrix_inner_top
      shift: [direction_L * case_key_distance, direction_T * case_key_distance]
    - ref: mirror_thumbfan_home_thumb
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]
    - ref: mirror_thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_B * case_key_distance]
    - ref: thumbfan_far_thumb
      shift: [direction_R * case_key_distance, direction_B * case_key_distance]
    - ref: thumbfan_home_thumb
      shift: [direction_L * case_key_distance, direction_B * case_key_distance]

pcbs.snowflake.outlines.board:
  outline: _board
  layer: Edge.Cuts

outlines._walls:
  # - what: outline
  #   name: _board_xl
  - what: outline
    name: _board
    operation: subtract

outlines.preview:
  add:
    $params: [outline_name]
    what: outline
    name: outline_name
    operation: stack

  # case:
  #   what: outline
  #   name: _board_xl
  #   operation: stack
  board:
    $extends: outlines.preview.add
    $args: [_board]
  touchpad:
    $extends: outlines.preview.add
    $args: [_touchpad]
  trrs:
    $extends: outlines.preview.add
    $args: [_trrs]
  keys:
    $extends: outlines.preview.add
    $args: [_keys]
  reset:
    $extends: outlines.preview.add
    $args: [_reset]
  controller:
    $extends: outlines.preview.add
    $args: [_controller]
  mounting:
    $extends: outlines.preview.add
    $args: [_mounting]
  nix:
    $extends: outlines.preview.add
    $args: [_nix]


